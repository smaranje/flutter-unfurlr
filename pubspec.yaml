name: unfurlr
description: Dart client for the unfurlr link-preview API. Get title, description, image, favicon and oEmbed for any URL with one GET, CORS-free on Flutter Web.
version: 0.1.0
homepage: https://unfurlr.onrender.com
repository: https://github.com/smaranje/flutter-unfurlr
issue_tracker: https://github.com/smaranje/flutter-unfurlr/issues
topics: [link-preview, opengraph, oembed, metadata, unfurl]
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  http: ^1.2.0
dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
