name: unfurlr_any_link_preview
description: Use unfurlr with any_link_preview, which fixes CORS "XMLHttpRequest error" link previews on Flutter Web.
version: 0.1.0
homepage: https://unfurlr.onrender.com
repository: https://github.com/smaranje/flutter-unfurlr
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"
dependencies:
  flutter:
    sdk: flutter
  any_link_preview: ^3.0.0
  unfurlr: ^0.1.0
